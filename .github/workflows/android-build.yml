name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACTIONS_AUDIT_NOTICES: "false"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: ./
        run: npm ci

      - name: Build Web App
        working-directory: ./
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
          cache-dependency-path: 'android/build.gradle'

      - name: Sync Capacitor
        working-directory: ./
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle Wrapper Jar Exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar is missing, downloading fallback from official source..."
            mkdir -p gradle/wrapper
            curl -sSLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.9/gradle/wrapper/gradle-wrapper.jar
          else
            echo "gradle-wrapper.jar exists."
          fi

      - name: Ensure Gradle Wrapper Properties and Script Exist
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "gradle-wrapper.properties is missing, creating it with Gradle 8.9..."
            cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-all.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          else
            echo "gradle-wrapper.properties exists, ensuring it uses Gradle 8.9..."
            sed -i 's/gradle-.*-all.zip/gradle-8.9-all.zip/g' gradle/wrapper/gradle-wrapper.properties
            sed -i 's/gradle-.*-bin.zip/gradle-8.9-all.zip/g' gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Force Generate Missing Wrapper
        run: |
          chmod +x gradlew || true
          ./gradlew wrapper --gradle-version 8.9 || gradle wrapper --gradle-version 8.9

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
