name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

defaults:
  run:
    working-directory: ./android

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: .

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Force Upgrade Gradle Wrapper to 8.11.1
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type all

      - name: Inject AndroidX Configuration Flags
        run: |
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Dynamically Patch SDK and Plugin Versions to 36 / 8.9.1
        run: |
          echo "==> Upgrading Compile and Target SDK properties to 36..."
          find . -name "build.gradle" -exec sed -i 's/compileSdk 35/compileSdk 36/g' {} +
          find . -name "build.gradle" -exec sed -i 's/compileSdkVersion 35/compileSdkVersion 36/g' {} +
          find . -name "build.gradle" -exec sed -i 's/targetSdk 35/targetSdk 36/g' {} +
          find . -name "build.gradle" -exec sed -i 's/targetSdkVersion 35/targetSdkVersion 36/g' {} +
          
          echo "==> Adjusting Android Gradle Plugin properties..."
          find . -name "build.gradle" -exec sed -i 's/8.7.2/8.9.1/g' {} +
          
          if [ -f "gradle/libs.versions.toml" ]; then
            echo "==> Version Catalog detected, updating TOML targets..."
            sed -i 's/agp = "8.7.2"/agp = "8.9.1"/g' gradle/libs.versions.toml
            sed -i 's/androidGradlePlugin = "8.7.2"/androidGradlePlugin = "8.9.1"/g' gradle/libs.versions.toml
          fi

      # FIXED STEP: Uses a completely flat, single-line echo command to prevent any YAML spacing alignment bugs
      - name: Generate Missing App Themes and Resources
        run: |
          mkdir -p app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="AppTheme" parent="Theme.AppCompat.DayNight.DarkActionBar">\n        <item name="colorPrimary">#6200EE</item>\n        <item name="colorPrimaryDark">#3700B3</item>\n        <item name="colorAccent">#03DAC6</item>\n    </style>\n    <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.NoActionBar">\n        <item name="android:background">#FFFFFF</item>\n    </style>\n</resources>' > app/src/main/res/values/styles.xml

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Note-Flow-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
