name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACTIONS_AUDIT_NOTICES: "false"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: ./
        run: npm ci

      - name: Build Web App
        working-directory: ./
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          cache-dependency-path: 'android/build.gradle'

      - name: Sync Capacitor
        working-directory: ./
        run: npx cap sync android

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Explicitly Upgrade Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type all

      - name: Ensure AndroidX Support
        run: |
          if [ ! -f gradle.properties ]; then
            echo "Creating gradle.properties..."
            echo "android.useAndroidX=true" > gradle.properties
            echo "android.enableJetifier=true" >> gradle.properties
          else
            echo "gradle.properties already exists. Appending properties if missing..."
            grep -qxF 'android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
            grep -qxF 'android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties
          fi

      - name: Dynamically Configure SDK and AGP Versions
        run: |
          echo "Updating build.gradle, app/build.gradle, and variables.gradle"
          
          # Force set to compileSdk and targetSdk versions to 36 in variables.gradle
          if [ -f variables.gradle ]; then
            sed -i 's/compileSdkVersion = [0-9]\+/compileSdkVersion = 36/g' variables.gradle
            sed -i 's/targetSdkVersion = [0-9]\+/targetSdkVersion = 36/g' variables.gradle
          fi

          # Force set to compileSdk and targetSdk versions to 36 in app/build.gradle
          if [ -f app/build.gradle ]; then
            sed -i 's/compileSdk [0-9]\+/compileSdk 36/g' app/build.gradle
            sed -i 's/targetSdk [0-9]\+/targetSdk 36/g' app/build.gradle
          fi

          # Bump Android Gradle Plugin to 8.9.1 in top level build.gradle
          if [ -f build.gradle ]; then
            sed -i 's/com.android.tools.build:gradle:[0-9.]\+/com.android.tools.build:gradle:8.9.1/g' build.gradle
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
