<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Note Flow</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d9488">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/0d9488/ffffff.png?text=NF">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              teal: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                200: '#99f6e4',
                300: '#5eead4',
                400: '#2dd4bf',
                500: '#14b8a6',
                600: '#0d9488',
                700: '#0f766e',
                800: '#115e59',
                900: '#134e4a',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'League Spartan', sans-serif;
        /* Vibrant Liquid Light */
        background: linear-gradient(-45deg, #ccfbf1, #e0f2fe, #f3e8ff, #dcfce7);
        background-size: 400% 400%;
        animation: liquidBG 15s ease infinite;
        min-height: 100vh;
        transition: background 0.5s ease;
        overflow-x: hidden;
      }
      
      body.dark {
        /* Deep Neon Liquid Dark */
        background: linear-gradient(-45deg, #0f172a, #134e4a, #312e81, #000000);
        background-size: 400% 400%;
      }

      @keyframes liquidBG {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
      }
      
      /* --- Premium Liquid Glass --- */

      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(25px) saturate(180%);
        -webkit-backdrop-filter: blur(25px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        border-radius: 1.5rem;
      }
      .dark .glass-card {
        /* Dark mode: Increased opacity for better visibility */
        background: rgba(30, 41, 59, 0.75); 
        backdrop-filter: blur(25px) saturate(180%);
        -webkit-backdrop-filter: blur(25px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      }

      .glass-header {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.6);
      }
      .dark .glass-header {
        background: rgba(15, 23, 42, 0.9);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .glass-footer {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        border-top: 1px solid rgba(255, 255, 255, 0.6);
      }
      .dark .glass-footer {
        background: rgba(15, 23, 42, 0.95);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* Buttons & Interactables */
      .glass-btn {
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.6);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-btn:active {
        transform: scale(0.98);
      }
      .dark .glass-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
      }
      .dark .glass-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
      }

      .glass-fab {
        background: rgba(13, 148, 136, 0.9);
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 25px -5px rgba(13, 148, 136, 0.5);
        border: 1px solid rgba(255,255,255,0.3);
      }
      .dark .glass-fab {
        background: rgba(20, 184, 166, 0.2);
        border: 1px solid rgba(20, 184, 166, 0.5);
        box-shadow: 0 10px 25px -5px rgba(20, 184, 166, 0.3);
        color: #fff;
      }

      /* Animations */
      @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
      .animate-float { animation: float 6s ease-in-out infinite; }

      /* Renamed/Aliased for compatibility */
      @keyframes slideUpFade { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .animate-slideUpFade { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      
      @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -20px) scale(0.9); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
      .animate-toastIn { animation: toastIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
      
      /* Fix for modal "sideways" bug: no x-translate */
      @keyframes modalUp { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .animate-modalUp { animation: modalUp 0.3s ease-out forwards; }
      
      @keyframes bounceOnce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      .animate-bounceOnce { animation: bounceOnce 2s infinite; }

    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "firebase/": "https://esm.sh/firebase@^12.6.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .catch(() => {});
        });
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
